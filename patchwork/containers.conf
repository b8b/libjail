# Settings for the podman running inside this container.
#
# This replaces the packaged sample; anything not set here falls back to the
# built-in defaults, which on FreeBSD are already correct (CNI plugin and
# network config directories under /usr/local, graphroot under /var/db).
[engine]
runtime = "ocijail"
runtime_supports_json = ["ocijail"]

[engine.runtimes]
ocijail = ["/usr/local/bin/ocijail"]

[network]
network_backend = "cni"

# The podman outside this image already uses 10.88.0.0/16 for its default
# network. Two networks on the same subnet cannot be routed or NATed
# independently, so the nested one gets a subnet of its own; adjust it here if
# the outer podman uses this one. The network is created (in memory) on first
# use, named after default_network.
default_network = "bridge0"
